<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>我的订阅｜AI HUB</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:15px/1.6 system-ui,-apple-system,sans-serif}.wrap{max-width:780px;margin:auto;padding:22px}a{color:#aebcff;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 30px}.panel{background:#131f34;border:1px solid #293954;border-radius:18px;padding:20px;margin:16px 0}h1{font-size:29px;margin:8px 0}p,small{color:#a7b5ce}label{display:block;margin-top:14px;font-size:13px}input,select{width:100%;background:#0d1728;border:1px solid #40506b;border-radius:10px;color:#fff;padding:12px;margin-top:5px;font:inherit}button{background:#dce4ff;color:#111a2e;border:0;border-radius:11px;padding:11px 17px;font-weight:700;cursor:pointer;margin-top:16px}.item{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #344158;padding:14px 0;align-items:center}.item button{margin:0;background:#26334a;color:#fff}.muted{color:#a7b5ce;font-size:12px}.warning{background:#3b2a22;border:1px solid #775038;padding:10px;border-radius:10px;font-size:12px}</style></head><body><div class="wrap"><header><b>AI HUB / 我的订阅</b><a href="./index.html">返回商城</a></header><h1>我的订阅记录</h1><p>记录已在官方平台购买的 AI 服务及到期日。此页面是本机管理工具，不会替你购买、续费或验证真实订阅状态。</p><div class="warning">数据仅保存在当前浏览器设备中。清除浏览器数据或更换设备可能丢失记录；不要输入密码、支付卡号或敏感信息。</div><section class="panel"><h2>添加订阅</h2><form id="form"><label>服务名称<select id="service" required><option>ChatGPT</option><option>Claude</option><option>Gemini</option><option>DeepSeek</option><option>Perplexity</option><option>Midjourney</option><option>其他 AI 服务</option></select></label><label>套餐备注（选填）<input id="plan" maxlength="80" placeholder="例如：Pro"></label><label>到期或续费日期<input id="date" type="date" required></label><button type="submit">保存到本机</button></form></section><section class="panel"><h2>订阅列表</h2><div id="list" aria-live="polite"></div><button id="export" type="button">导出 JSON 备份</button></section><small>AI HUB 独立导航原型 · 未接入账户服务器和支付系统</small></div><script>const KEY='aihub-subscriptions-v1';let data=[];try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');data=Array.isArray(raw)?raw:[]}catch{};const list=document.getElementById('list');function save(){localStorage.setItem(KEY,JSON.stringify(data))}function draw(){list.replaceChildren();if(!data.length){const p=document.createElement('p');p.textContent='尚无订阅记录。';list.append(p);return}data.sort((a,b)=>a.date.localeCompare(b.date));data.forEach(x=>{const div=document.createElement('div');div.className='item';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=x.service+(x.plan?' · '+x.plan:'');const meta=document.createElement('div');meta.className='muted';const days=Math.ceil((new Date(x.date+'T00:00:00')-new Date())/86400000);meta.textContent='记录日期：'+x.date+' · '+(days<0?'已过期 '+(-days)+' 天':days<=7?'即将到期':'距离日期约 '+days+' 天');info.append(title,meta);const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{if(confirm('删除这条本机记录？')){data=data.filter(v=>v.id!==x.id);save();draw()}};div.append(info,del);list.append(div)})}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();data.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),service:document.getElementById('service').value,plan:document.getElementById('plan').value.trim(),date:document.getElementById('date').value});save();draw();e.target.reset()});document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aihub-subscriptions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};draw()</script></body></html>
