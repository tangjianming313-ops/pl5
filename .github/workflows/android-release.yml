name: Publish signed 观数知微 Android APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Must match android-app/app/build.gradle versionName, e.g. 1.1.0"
        required: true
        type: string
permissions:
  contents: write
jobs:
  signed_release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GSZW_ANDROID_STORE_PASSWORD: ${{ secrets.GSZW_ANDROID_STORE_PASSWORD }}
      GSZW_ANDROID_KEY_ALIAS: ${{ secrets.GSZW_ANDROID_KEY_ALIAS }}
      GSZW_ANDROID_KEY_PASSWORD: ${{ secrets.GSZW_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version" >&2; exit 1; }
          grep -F "versionName '$VERSION'" android-app/app/build.gradle
          test -n "$GSZW_ANDROID_STORE_PASSWORD"
          test -n "$GSZW_ANDROID_KEY_ALIAS"
          test -n "$GSZW_ANDROID_KEY_PASSWORD"
      - name: Decode signing key into temporary runner storage
        env:
          KEYSTORE_BASE64: ${{ secrets.GSZW_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing signing key secret" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gszw-release.jks"
          chmod 600 "$RUNNER_TEMP/gszw-release.jks"
          echo "GSZW_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/gszw-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        working-directory: android-app
        run: gradle --no-daemon assembleRelease
      - name: Verify APK exists
        run: |
          test -s android-app/app/build/outputs/apk/release/app-release.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk "guanshuzhiwei-v${VERSION}.apk"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "This version is already released. Increase versionCode/versionName instead of overwriting a published APK." >&2
            exit 1
          fi
          gh release create "$TAG" "guanshuzhiwei-v${VERSION}.apk" \
            --title "观数知微 Android v${VERSION}" \
            --notes "Signed production APK for 观数知微. Update requires a matching Android signing certificate and a higher versionCode. For release notes, see the in-app update center."
