name: Build Android APK
on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest runner already includes Android SDK.
      # Avoid setup-android action failing before the build starts.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-app
        run: |
          gradle --version
          gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: guangdong-laizong-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
