name: Build AI HUB Android APK
on:
  push:
    branches: [main]
    paths:
      - 'ai-hub/android-app/**'
      - '.github/workflows/ai-hub-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build AI HUB debug APK
        working-directory: ai-hub/android-app
        run: gradle --no-daemon assembleDebug
      - name: Upload AI HUB debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-hub-android-test-apk
          path: ai-hub/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
