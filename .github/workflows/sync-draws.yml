name: 每日同步排列5开奖
on:
  schedule:
    # Beijing time: 21:45, 22:15, 22:45, 23:15, and next morning 08:30
    - cron: '45 13 * * *'
    - cron: '15 14 * * *'
    - cron: '45 14 * * *'
    - cron: '15 15 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python synchronization script
        run: python -m py_compile scripts/sync_draws.py
      - name: Fetch and validate multiple lottery sources
        run: python scripts/sync_draws.py
      - name: Commit validated updates
        run: |
          if ! git diff --quiet -- draws-auto.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add draws-auto.json
            git commit -m "Update verified P5 draw history"
            git push
          fi
