name: 每日同步排列5开奖
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_draws.py'
      - '.github/workflows/sync-draws.yml'
  schedule:
    # UTC times; Beijing = UTC+8. Daily checks: 21:10, 21:40,
    # 22:10, 22:40, 23:10, next day 00:10 and 08:30.
    - cron: '10 13 * * *'
    - cron: '40 13 * * *'
    - cron: '10 14 * * *'
    - cron: '40 14 * * *'
    - cron: '10 15 * * *'
    - cron: '10 16 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python synchronization script
        run: python -m py_compile scripts/sync_draws.py
      - name: Fetch and validate multiple lottery sources
        run: python scripts/sync_draws.py
      - name: Commit validated updates
        run: |
          if ! git diff --quiet -- draws-auto.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add draws-auto.json
            git commit -m "Update verified P5 draw history"
            git push
          fi
