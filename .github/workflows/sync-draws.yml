name: 每日同步排列5开奖
on:
  schedule:
    - cron: '20 14 * * *'
    - cron: '20 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate official results
        run: python scripts/sync_draws.py
      - name: Commit validated updates
        run: |
          if ! git diff --quiet -- draws-auto.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add draws-auto.json
            git commit -m "Update verified P5 draw history"
            git push
          fi
