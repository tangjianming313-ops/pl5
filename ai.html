<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fb"><title>来总 AI 助手</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#1b3046;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px;background:#fff;border-bottom:1px solid #e8edf2}.top strong{font-size:20px}.top a{color:#1678d4;text-decoration:none}.body{flex:1;padding:20px 16px}.card{border:1px solid #e4eaf0;border-radius:20px;background:#fff;padding:20px;box-shadow:0 3px 18px #1d35450b}.hint{color:#73859a;font-size:13px;line-height:1.8}input,textarea{font:inherit;width:100%;border:1px solid #dbe3ed;border-radius:12px;padding:13px;margin:10px 0;background:#fff}button{font:inherit;border:0;background:#1678d4;color:white;border-radius:12px;padding:12px 17px;font-weight:700}button:disabled{opacity:.5}.msg{white-space:pre-wrap;line-height:1.7;border-radius:14px;padding:14px;margin:10px 0;background:#fff;border:1px solid #e6ebf1}.mine{background:#e9f3ff;border-color:#d5e8fb}.compose{padding:14px 16px;background:#fff;border-top:1px solid #e6ebf1}.row{display:flex;gap:10px;align-items:center}.row textarea{margin:0;min-height:55px;max-height:140px;resize:vertical}.quota{font-size:12px;color:#6c8092}.error{color:#b23535}</style></head><body><div class="app"><div class="top"><strong>✦ 来总 AI 助手</strong><a href="./">返回首页</a></div><div class="body"><section class="card" id="activate"><h2>三人专属激活</h2><p class="hint">每个邀请码只能激活一次。每人每天30次提问，北京时间零点重置。不要向其他人透露邀请码。</p><input id="invite" type="password" autocomplete="off" placeholder="请输入专属邀请码"><button id="activateBtn">激活 AI 助手</button><p id="activateStatus" class="hint"></p></section><section id="chat" hidden><div class="card"><strong>AI 数据分析助手</strong><p class="hint">支持排码规则解释、统计方法和回测思路。AI 不能保证预测中奖，未接入的开奖数据不会被自动读取。</p><div class="row"><span id="quota" class="quota">查询额度中…</span><button id="clear" style="margin-left:auto;background:#e9f1f8;color:#35668e">清空对话</button><button id="logout" style="background:#e9f1f8;color:#35668e">退出此设备</button></div></div><div id="messages" aria-live="polite"></div></section></div><div class="compose" id="composer" hidden><div class="row"><textarea id="message" maxlength="1200" placeholder="输入问题，例如：解释最近两期二位定位排除法"></textarea><button id="send">发送</button></div><div id="sendStatus" class="hint"></div></div></div><script>const API=''; // Deployment: replace with your Cloudflare Worker HTTPS URL, no trailing slash.
const $=id=>document.getElementById(id);let session=localStorage.getItem('lz-ai-session')||'';let history=[];function status(id,t){$(id).textContent=t}function show(){const active=!!session;$('activate').hidden=active;$('chat').hidden=!active;$('composer').hidden=!active;if(active)quota()}async function call(path,body){if(!API)throw Error('AI服务尚未部署，请管理员先完成后台配置');const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json',...(session?{'Authorization':'Bearer '+session}:{})},body:JSON.stringify(body||{})});const j=await r.json();if(!r.ok){const e=new Error(j.error||'请求失败');e.status=r.status;throw e}return j}async function quota(){try{const q=await call('/quota',{});status('quota','今日剩余 '+q.remaining+' / 30 次');}catch(e){if(e.status===401){session='';history=[];localStorage.removeItem('lz-ai-session');show();status('activateStatus','授权已失效，请联系管理员重新分配邀请码')}else status('quota',e.message)}}$('activateBtn').onclick=async()=>{const b=$('activateBtn');b.disabled=true;try{const j=await call('/activate',{code:$('invite').value.trim()});session=j.token;localStorage.setItem('lz-ai-session',session);$('invite').value='';show()}catch(e){status('activateStatus',e.message)}finally{b.disabled=false}};$('clear').onclick=()=>{history=[];$('messages').replaceChildren();status('sendStatus','聊天记录已清空')};$('logout').onclick=()=>{session='';history=[];$('messages').replaceChildren();localStorage.removeItem('lz-ai-session');show()};$('send').onclick=async()=>{const m=$('message').value.trim();if(!m)return;const b=$('send');b.disabled=true;const mine=document.createElement('div');mine.className='msg mine';mine.textContent=m;$('messages').appendChild(mine);$('message').value='';status('sendStatus','正在分析…');try{const j=await call('/chat',{message:m,history:history.slice(-8)});history.push({role:'user',content:m},{role:'assistant',content:String(j.answer).slice(0,1200)});if(history.length>8)history=history.slice(-8);const el=document.createElement('div');el.className='msg';el.textContent=j.answer;$('messages').appendChild(el);status('quota','今日剩余 '+j.remaining+' / 30 次');status('sendStatus','')}catch(e){status('sendStatus',e.message)}finally{b.disabled=false}};show();</script></body></html>
